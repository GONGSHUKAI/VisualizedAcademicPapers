<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<!-- Generated by tools/build.py from catalog.json. Edit this template or the catalog, not index.html. -->
<title>Visualized Academic Papers</title>
<meta name="description" content="论文精读网页合集：每篇论文一个网页，拆方法、画结果、标疑点。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F0; --surface:#F9FBFA; --ink:#182120; --ink-2:#44504E; --muted:#6B7775;
  --rule:#D3DAD8; --rule-2:#BCC6C3; --accent:#1F6B63; --accent-soft:#D6E7E4;
  --f-disp:"Schibsted Grotesk","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111716; --surface:#172020; --ink:#E4EBE9; --ink-2:#B3BFBC; --muted:#85928F;
    --rule:#283331; --rule-2:#364341; --accent:#71BDB2; --accent-soft:#1D3431;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111716; --surface:#172020; --ink:#E4EBE9; --ink-2:#B3BFBC; --muted:#85928F;
  --rule:#283331; --rule-2:#364341; --accent:#71BDB2; --accent-soft:#1D3431;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:32px}}

header.top{padding-block:56px 32px;border-bottom:1px solid var(--rule)}
.eyebrow{font:500 12px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(34px,5.6vw,58px)/1.08 var(--f-disp);letter-spacing:-.015em;margin:12px 0 16px;text-wrap:balance}
.lede{max-width:42em;color:var(--ink-2);margin:0 0 18px;font-size:17px}
.stats{font:500 13px/1.5 var(--f-mono);color:var(--muted);margin:0}

section.topic{padding-block:40px}
section.topic+section.topic{border-top:1px solid var(--rule)}
.thead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:10px}
.tpath{font:500 12px/1.5 var(--f-mono);color:var(--muted);letter-spacing:.04em}
h2{font:700 28px/1.25 var(--f-disp);margin:4px 0 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 a{color:var(--ink);text-decoration:none}
h2 a:hover{color:var(--accent);text-decoration:underline}
.tcount{font:500 13px/1 var(--f-mono);color:var(--muted)}
.tsum{margin:0;max-width:44em;color:var(--ink-2)}
.tgo{flex:none;display:inline-flex;align-items:center;font:600 14.5px/1 var(--f-body);color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:4px;padding:10px 14px}
.tgo:hover{background:var(--accent-soft)}

ul.papers{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--rule)}
li.paper{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 28px;padding-block:20px;border-bottom:1px solid var(--rule)}
.pmeta{display:flex;flex-direction:column;gap:2px;font:400 13px/1.6 var(--f-mono);color:var(--muted)}
.pdate{color:var(--ink-2);font-weight:500}
.pmeta .ax{color:var(--muted)}
.pbody h3{font:700 21px/1.25 var(--f-disp);margin:0}
.pbody h3 a{color:var(--ink);text-decoration:none}
.pbody h3 a:hover{color:var(--accent);text-decoration:underline}
.pfull{margin:2px 0 8px;color:var(--muted);font-size:13.5px;line-height:1.55}
.psum{margin:0;color:var(--ink-2);max-width:48em}
.porg{margin:6px 0 0;font-size:13px;color:var(--muted)}
.cat{margin-top:30px}
.chead{font:700 19px/1.3 var(--f-disp);margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;color:var(--ink)}
.chead::before{content:"";flex:none;width:10px;height:10px;border-radius:2px;background:var(--accent);align-self:center}
.csum{margin:4px 0 0;max-width:44em;color:var(--ink-2);font-size:15px}
.cat ul.papers{margin-top:12px}
@media (max-width:640px){
  li.paper{grid-template-columns:1fr}
  .pmeta{flex-direction:row;gap:14px}
}

footer{padding-block:28px 56px;border-top:1px solid var(--rule);color:var(--muted);font-size:13.5px;line-height:1.75}
footer p{margin:0 0 8px;max-width:60em}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="eyebrow">Visualized Academic Papers</div>
  <h1>论文精读</h1>
  <p class="lede">每篇论文一个网页：拆开方法，按原表比例重画结果，把论文的主张和我们的判断分开写。同一专题的论文另有一页横向对照。</p>
  <p class="stats">{{STATS}}</p>
</header>

{{TOPICS}}

<footer>
  <p>图用各论文 arXiv 源码里的原图，数字按源码里的 tex 表格核对。页面中标「解读」的内容是我们的判断。</p>
  <p>源码与新增论文的方法见 <a href="https://github.com/GONGSHUKAI/VisualizedAcademicPapers" target="_blank" rel="noopener">GitHub 仓库</a>。</p>
</footer>
</div>
</body>
</html>
